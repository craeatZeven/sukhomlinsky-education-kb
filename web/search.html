<script>
/* 双模式检索：
 *   1) 后端可用（config.js 的 apiBase 指向 FastAPI / Cloudflare Worker）→ 服务端 FTS5 检索 + 分页 + 聚合
 *   2) 后端不可用（例如 *.workers.dev 在当前网络被屏蔽）→ 自动回退到静态分片（data/index.json + data/search/all.json）
 * 两种模式界面一致，用户无感；静态分片只在回退时按需加载，不拖慢首屏。 */
const CFG = window.KB_CONFIG || {};
const API = (CFG.apiBase || "").replace(/\/$/, "");
const $ = id => document.getElementById(id);
let MODE = "api";          // api | static
let SDATA = null;          // 静态回退数据 {index, corpusById}
let META = { sources: [], topics: [] };
let state = { q: "", source: "", topic: "", type: "", page: 1, size: 20, total: 0, pages: 0, items: [] };

function labelType(t){ return KB.typeLabel(t); }
function topicTitle(slug){ const t = META.topics.find(x => x.slug === slug); return t ? t.title : slug; }
function sourceTitle(slug){ const s = META.sources.find(x => x.slug === slug); return s ? s.title : slug; }

/* 后端探测/请求带超时：*.workers.dev 在国内常被屏蔽，TCP 连接会长时间挂起，
 * 不能让用户干等——4 秒不通就回退静态分片。 */
async function api(path, timeoutMs){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeoutMs || 4000);
  try{
    const r = await fetch(API + path, { headers: { "Accept": "application/json" }, signal: ctl.signal });
    if(!r.ok) throw new Error(path + " → HTTP " + r.status);
    return await r.json();
  }catch(e){
    throw new Error(e.name === "AbortError" ? "后端无响应（超时）" : e.message);
  }finally{
    clearTimeout(timer);
  }
}

/* ---------- 静态回退 ---------- */
async function loadStatic(){
  if(SDATA) return SDATA;
  const [index, corpus] = await Promise.all([KB.loadIndex(), KB.loadSearch("all")]);
  SDATA = { index, corpusById: new Map(corpus.map(e => [e.id, e])) };
  return SDATA;
}

function snippetFor(c, terms){
  const text = (SDATA.corpusById.get(c.id) || {}).text || "";
  const lower = text.toLowerCase();
  let pos = -1;
  for(const t of terms){
    const i = lower.indexOf(t);
    if(i >= 0 && (pos < 0 || i < pos)) pos = i;
  }
  if(pos < 0) return (c.cn || c.preview || "").slice(0, 160);
  return text.slice(Math.max(0, pos - 40), Math.max(0, pos - 40) + 160);
}

function staticSearch(){
  const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  const list = SDATA.index.filter(c=>{
    if(state.source && c.source !== state.source) return false;
    if(state.type && c.type !== state.type) return false;
    if(state.topic && !(c.topics||[]).includes(state.topic)) return false;
    if(!terms.length) return true;
    const text = KB.searchText(c, SDATA.corpusById.get(c.id));
    return terms.every(t => text.includes(t));
  });
  const start = (state.page - 1) * state.size;
  const items = list.slice(start, start + state.size).map(c=>({
    ...c, snippet: snippetFor(c, terms),
  }));
  return { total: list.length, items, mode: "static-client" };
}

function cardHtml(c){
  const quote = c.snippet || c.preview || c.cn || c.title;
  const meta = KB.cardMetaText(c);
  return `<a class="row" href="card.html?id=${encodeURIComponent(c.id)}#${KB.esc(c.id)}">
    <p class="row-quote">${KB.esc(quote)}</p>
    <div class="row-meta">
      <span class="row-title">${KB.esc(c.title)}</span>
      <span>${KB.esc(labelType(c.type))}</span>
      ${KB.sourcePop(c.source)}
      <span>${KB.esc(c.id)}</span>
      ${meta?`<span class="row-entry">${KB.esc(meta)}</span>`:""}
    </div>
  </a>`;
}

function fillFacets(){
  const fS = $("fSource"), fT = $("fTopic"), fType = $("fType");
  fS.innerHTML = '<option value="">全部来源</option>';
  fT.innerHTML = '<option value="">全部主题</option>';
  fType.innerHTML = '<option value="">全部类型</option>';
  META.sources.forEach(s=>{ fS.insertAdjacentHTML("beforeend", `<option value="${s.slug}">${s.slug} · ${s.cards}</option>`); });
  META.topics.forEach(t=>{ fT.insertAdjacentHTML("beforeend", `<option value="${t.slug}">${t.slug} · ${t.cards}</option>`); });
  Object.keys(KB.TYPE_LABELS).forEach(t=>{ fType.insertAdjacentHTML("beforeend", `<option value="${t}">${labelType(t)}</option>`); });
}

async function initData(){
  try{
    const m = await api("/api/meta");
    META.sources = (m.sources||[]).map(s=>({slug:s.slug, title:s.slug, cards:s.cards}));
    META.topics = (m.topics||[]).map(t=>({slug:t.slug, title:t.slug, cards:t.cards}));
    MODE = "api";
    $("apiState").textContent = `后端已连接 · 共 ${m.total_cards} 张卡 · 来源 ${m.sources.length} · 主题 ${m.topics.length}（API：${API || "同源"}）`;
  }catch(e){
    MODE = "static";
    await loadStatic();
    const meta = KB.meta;
    META.sources = meta.sources.map(s=>({slug:s.slug, title:s.title, cards:s.cards||0}));
    META.topics = meta.topics.map(t=>({slug:t.slug, title:t.title, cards:t.cards||0}));
    $("apiState").textContent = `后端不可用（${e.message}），已切换到本地静态检索 · 共 ${meta.counts.cards} 张卡`;
  }
  try { fillFacets(); } catch(e) { $("apiState").textContent += "（筛选器初始化失败：" + e.message + "）"; }
}

async function run(){
  $("results").innerHTML = `<p class="meta">检索中…</p>`;
  let r;
  try{
    if(MODE === "api"){
      const p = new URLSearchParams();
      if(state.q) p.set("q", state.q);
      if(state.source) p.set("source", state.source);
      if(state.topic) p.set("topic", state.topic);
      if(state.type) p.set("type", state.type);
      p.set("page", state.page); p.set("size", state.size);
      r = await api("/api/search?" + p.toString());
    }else{
      r = staticSearch();
    }
  }catch(e){
    if(MODE === "api"){
      MODE = "static";
      try{
        await loadStatic(); try { fillFacets(); } catch(e2) {} r = staticSearch();
        $("apiState").textContent = `后端请求失败（${e.message}），已切换到本地静态检索 · 共 ${SDATA.index.length} 张卡`;
      }catch(e2){
        $("results").innerHTML = `<p class="empty" style="display:block">检索失败：${e2.message}</p>`;
        return;
      }
    }else{
      $("results").innerHTML = `<p class="empty" style="display:block">检索失败：${e.message}</p>`;
      return;
    }
  }
  state.items = r.items || [];
  state.total = r.total || 0;
  state.pages = Math.max(1, Math.ceil(state.total / state.size));
  $("stats").innerHTML = `
    <div class="stat"><b>${state.total}</b><span>命中卡片</span></div>
    <div class="stat"><b>${state.pages}</b><span>页数</span></div>
    <div class="stat"><b>${r.mode || MODE}</b><span>检索模式</span></div>`;
  $("results").innerHTML = state.items.length ? state.items.map(cardHtml).join("")
    : `<p class="empty" style="display:block">没有匹配的卡片，换个词试试。</p>`;
  $("pager").innerHTML = `
    <button class="chip" id="prevBtn" type="button" ${state.page<=1?"disabled":""}>← 上一页</button>
    <span class="meta">第 ${state.page} / ${state.pages} 页</span>
    <button class="chip" id="nextBtn" type="button" ${state.page>=state.pages?"disabled":""}>下一页 →</button>`;
  const prev = $("prevBtn"), next = $("nextBtn");
  if(prev) prev.addEventListener("click", ()=>{ state.page = Math.max(1, state.page-1); run(); });
  if(next) next.addEventListener("click", ()=>{ state.page = Math.min(state.pages, state.page+1); run(); });
}

function downloadBlob(filename, text, type){
  const blob = new Blob([text], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  a.remove(); URL.revokeObjectURL(url);
}
function csvEscape(v){ const s = String(v==null?"":v).replace(/"/g,'""'); return /[",\n]/.test(s) ? `"${s}"` : s; }

document.addEventListener("DOMContentLoaded", async ()=>{
  try{ await initData(); }catch(e){ $("apiState").textContent = "初始化失败：" + e.message; }
  $("searchBtn").addEventListener("click", ()=>{
    state.q = $("q").value.trim(); state.source = $("fSource").value;
    state.topic = $("fTopic").value; state.type = $("fType").value;
    state.size = parseInt($("fSize").value, 10) || 20; state.page = 1; run();
  });
  $("q").addEventListener("keydown", e=>{ if(e.key === "Enter") $("searchBtn").click(); });
  ["fSource","fTopic","fType","fSize"].forEach(id=>$(id).addEventListener("change", ()=>$("searchBtn").click()));
  $("randomBtn").addEventListener("click", async ()=>{
    try{
      if(MODE === "api"){ const c = await api("/api/random"); location.href = "card.html?id=" + encodeURIComponent(c.id) + "#" + c.id; }
      else { const c = await KB.loadRandomCard(); location.href = "card.html?id=" + encodeURIComponent(c.id) + "#" + c.id; }
    }catch(e){ alert("取随机卡失败：" + e.message); }
  });
  $("exportJson").addEventListener("click", ()=>downloadBlob("kb-search-page.json", JSON.stringify(state.items, null, 2), "application/json"));
  $("exportCsv").addEventListener("click", ()=>{
    const cols = ["id","type","title","source","topics","ref"];
    const rows = [cols.join(",")].concat(state.items.map(c=>cols.map(k=>{
      if(k === "topics") return csvEscape((c.topics||[]).join("|"));
      return csvEscape(c[k]);
    }).join(",")));
    downloadBlob("kb-search-page.csv", "\ufeff" + rows.join("\n"), "text/csv;charset=utf-8");
  });
  run();
});
</script>
