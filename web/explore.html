<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>主题浏览 · 苏霍姆林斯基教育知识库</title>
<link rel="stylesheet" href="style.css?v=20260907" />
</head>
<body>
<nav class="topnav">
  <div class="inner">
    <a class="brand" href="index.html">苏霍姆林斯基教育知识库</a>
    <div class="nav-links">
      <a class="nav-link" href="index.html">首页</a>
      <a class="nav-link active" href="explore.html">主题浏览</a>
      <a class="nav-link" href="cases.html">案例 Review</a>
      <a class="nav-link" href="sources.html">书源</a>
    </div>
  </div>
</nav>

<header class="page-head">
  <div class="wrap">
    <div class="eyebrow">Browse by Topic</div>
    <h1>按主题浏览</h1>
    <p>先选“讲什么”，类型和其他标签只是辅助筛选。</p>
    <div class="searchbox">
      <input id="search" type="search" placeholder="关键词（可选）：后进生、健康、读书、评价……" />
      <button class="chip" id="clearBtn" type="button">重置</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section>
    <h2 class="section-title">主题 · 主分类</h2>
    <div class="chips" id="topicChips" style="justify-content:flex-start; max-width:100%"></div>
  </section>

  <section>
    <h2 class="section-title">标签 · 可选筛选</h2>
    <p class="section-sub">类型（quote/case/principle/method/practice）与状态标签（OCR待校、待纸本核、跨主题），可多选。</p>
    <div class="chips" id="tagChips" style="justify-content:flex-start"></div>
  </section>

  <section>
    <div class="stats" id="stats" style="margin:18px 0"></div>
    <div class="grid" id="cardGrid"></div>
    <div class="empty" id="empty">没有匹配的卡片，换个主题或标签试试。</div>
    <div class="load-wrap"><button id="loadMore" class="chip" type="button" style="display:none">加载更多卡片</button></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p><a href="index.html">← 返回首页</a> · 数据源 <a href="../INDEX.md">INDEX.md</a></p>
  </div>
</footer>

<script src="data.js?v=20260907"></script>
<script src="theme.js?v=20260907"></script>
<script>
const SOURCES = (window.KB_DATA && window.KB_DATA.sources) || [];
const TOPICS = (window.KB_DATA && window.KB_DATA.topics) || [];
const CARDS = (window.KB_DATA && window.KB_DATA.cards) || [];
const TYPE_LABELS = {quote:"quote 语录", case:"case 案例", principle:"principle 原则", method:"method 方法", practice:"practice 实践"};
const EXTRA_TAG_LABELS = {"OCR待校":"OCR 待校", "待纸本核":"待纸本核", "跨主题":"跨主题"};

let activeTopic = "all";
let activeTags = new Set();
let currentFiltered = [];
let visibleCount = 60;
const $ = id => document.getElementById(id);

function topicTitle(slug){ const t=TOPICS.find(x=>x.slug===slug); return t?t.title:slug; }
function allTagDefs(){
  const typeTags = [...new Set(CARDS.map(c=>c.type))].map(t=>({id:"type:"+t, label:TYPE_LABELS[t]||t, kind:"type"}));
  const extraTags = [...new Set(CARDS.flatMap(c=>c.tags||[]))].map(t=>({id:"tag:"+t, label:EXTRA_TAG_LABELS[t]||t, kind:"tag"}));
  return [...typeTags, ...extraTags];
}
function buildTopicChips(){
  const chips = [{slug:"all", title:"全部主题"}, ...TOPICS.map(t=>({slug:t.slug, title:t.title}))];
  $("topicChips").innerHTML = chips.map(t=>`<button class="chip ${t.slug===activeTopic?"active":""}" data-topic="${t.slug}">${t.title}</button>`).join("");
}
function buildTagChips(){
  $("tagChips").innerHTML = allTagDefs().map(t=>{
    const active = activeTags.has(t.id);
    return `<button class="chip ${active?"active":""}" data-tag="${t.id}">${t.label}</button>`;
  }).join("");
}
function cardSearchText(c){
  const topics = (c.topics||[]).map(topicTitle).join(" ");
  const tags = [TYPE_LABELS[c.type]||c.type, ...(c.tags||[])].join(" ");
  return (c.title+" "+(c.cn||"")+" "+c.id+" "+c.source+" "+topics+" "+tags).toLowerCase();
}
function sourceTitle(slug){ const s=SOURCES.find(x=>x.slug===slug); return s?s.title:slug; }
function cardHTML(c){
  const topicBadges = (c.topics||[]).map(s=>`<span class="badge" style="margin-right:6px">${topicTitle(s)}</span>`).join("");
  const extraTags = (c.tags||[]).map(t=>`<span class="meta" style="border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px">${EXTRA_TAG_LABELS[t]||t}</span>`).join("");
  return `
  <article class="card" id="card-${c.id}">
    <div class="card-top">
      <div>${topicBadges}</div>
      <span class="badge" style="background:transparent;border:1px solid var(--line);color:var(--soft)">${TYPE_LABELS[c.type]||c.type}</span>
    </div>
    <h3>${c.title}</h3>
    ${c.excerpt?`<p class="excerpt">“${c.excerpt}”</p>`:""}
    ${c.cn?`<p class="cn">${c.cn}</p>`:""}
    <div class="ref" style="margin-top:10px">${c.id} · ${sourceTitle(c.source)}<br>${c.ref}</div>
    ${extraTags?`<div style="margin-top:8px">${extraTags}</div>`:""}
  </article>`;
}
function paintCards(){
  const slice = currentFiltered.slice(0, visibleCount);
  $("cardGrid").innerHTML = slice.map(cardHTML).join("");
  $("empty").style.display = currentFiltered.length ? "none" : "block";
  $("loadMore").style.display = currentFiltered.length > visibleCount ? "inline-block" : "none";
}
function applyFilter(){
  const q = ($("search").value||"").trim().toLowerCase();
  currentFiltered = CARDS.filter(c=>{
    if(activeTopic!=="all" && !(c.topics||[]).includes(activeTopic)) return false;
    for(const tagId of activeTags){
      if(tagId.startsWith("type:") && c.type !== tagId.slice(5)) return false;
      if(tagId.startsWith("tag:") && !(c.tags||[]).includes(tagId.slice(4))) return false;
    }
    if(q && !cardSearchText(c).includes(q)) return false;
    return true;
  });
  visibleCount = 60;
  paintCards();
}
function renderStats(){
  const tagText = activeTags.size ? ` · ${activeTags.size} 个标签` : "";
  $("stats").innerHTML = `
    <div class="stat"><b>${currentFiltered.length}</b><span>当前结果${tagText}</span></div>
    <div class="stat"><b>${CARDS.length}</b><span>全部卡片</span></div>`;
}
document.addEventListener("DOMContentLoaded", ()=>{
  buildTopicChips(); buildTagChips(); applyFilter(); renderStats();
  $("topicChips").addEventListener("click", e=>{
    const btn=e.target.closest(".chip"); if(!btn||!btn.dataset.topic) return;
    activeTopic=btn.dataset.topic; buildTopicChips(); applyFilter(); renderStats();
  });
  $("tagChips").addEventListener("click", e=>{
    const btn=e.target.closest(".chip"); if(!btn||!btn.dataset.tag) return;
    const id = btn.dataset.tag;
    if(activeTags.has(id)) activeTags.delete(id); else activeTags.add(id);
    buildTagChips(); applyFilter(); renderStats();
  });
  $("search").addEventListener("input", ()=>{ applyFilter(); renderStats(); });
  $("loadMore").addEventListener("click", ()=>{ visibleCount+=60; paintCards(); });
  $("clearBtn").addEventListener("click", ()=>{
    $("search").value=""; activeTopic="all"; activeTags.clear();
    buildTopicChips(); buildTagChips(); applyFilter(); renderStats();
  });
});
</script>
</body>
</html>
