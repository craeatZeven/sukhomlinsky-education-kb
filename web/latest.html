</head>
<body data-theme="green">
<nav class="topnav">
  <div class="inner">
    <a class="brand" href="index.html">苏霍姆林斯基教育知识库</a>
    <div class="nav-links">

<header class="page-head">
  <div class="wrap">
    <div class="eyebrow">Latest</div>
    <h1>最近更新</h1>
    <p>按卡片 ID 倒序显示最近新增的内容；ID 越大，越新。</p>
  </div>
</header>

<main class="wrap">
  <section>
    <div class="stats" id="stats" style="margin:18px 0"></div>
    <div class="grid" id="latestGrid"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p><a href="index.html">← 返回首页</a> · 数据源 <a href="../INDEX.md">INDEX.md</a></p>
  </div>
</footer>

<script src="data.js?v=20260907"></script>
<script src="theme.js?v=20260907"></script>
<script>
const CARDS = (window.KB_DATA && window.KB_DATA.cards) || [];
const SOURCES = (window.KB_DATA && window.KB_DATA.sources) || [];
const TOPICS = (window.KB_DATA && window.KB_DATA.topics) || [];
function sourceTitle(slug){ const s=SOURCES.find(x=>x.slug===slug); return s?s.title:slug; }
function topicTitle(slug){ const t=TOPICS.find(x=>x.slug===slug); return t?t.title:slug; }
document.addEventListener("DOMContentLoaded", ()=>{
  const sorted = CARDS.slice().sort((a,b)=>b.id.localeCompare(a.id, "en"));
  const latest = sorted.slice(0, 60);
  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>${latest.length}</b><span>最近卡片</span></div>
    <div class="stat"><b>${CARDS.length}</b><span>全部卡片</span></div>`;
  document.getElementById("latestGrid").innerHTML = latest.map(c=>`
    <article class="card">
      <div class="card-top">
        <span class="badge">${c.id}</span>
        <span class="meta">${c.type}</span>
      </div>
      <h3 style="margin:10px 0 6px"><a href="card.html?id=${c.id}#${c.id}" style="color:inherit">${c.title}</a></h3>
      <p class="ref">${sourceTitle(c.source)}</p>
      <p class="ref">${(c.topics||[]).map(topicTitle).join(" / ")}</p>
    </article>`).join("");
});
</script>
</body>
</html>
