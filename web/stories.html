<header class="page-head">
  <div class="wrap">
    <div class="eyebrow">541 Stories</div>
    <h1>《做人的故事》541 篇</h1>
    <p>按原书 OCR 页码顺序浏览全部故事卡：每篇都是短原文摘录 + 中文转述 + 教育应用 + 出处核对。</p>
    <div class="searchbox">
      <input id="q" type="search" placeholder="搜索故事名、关键词或页码，如：奶奶、p150、夜莺……" />
      <button class="chip" id="randomBtn" type="button">随机一篇</button>
      <button class="chip" id="clearBtn" type="button">清空</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section>
    <div class="stats" id="stats" style="margin:18px 0"></div>
    <div class="grid" id="storyGrid"></div>
    <div class="empty" id="empty">没有匹配的故事，换个关键词试试。</div>
    <div class="load-wrap"><button id="loadMore" class="chip" type="button" style="display:none">加载更多故事</button></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p><a href="index.html">← 返回首页</a> · 数据源 <a href="../INDEX.md">INDEX.md</a></p>
  </div>
</footer>

<script src="data.js?v=20260907"></script>
<script src="theme.js?v=20260907"></script>
<script>
const CARDS = (window.KB_DATA && window.KB_DATA.cards) || [];
const ZUOREN_SOURCE = "zuo-ren-de-gu-shi-zh";
const STORIES = CARDS
  .filter(c => c.source === ZUOREN_SOURCE)
  .map(c => {
    const m = (c.ref || "").match(/p\s*(\d+)/);
    return { ...c, page: m ? parseInt(m[1], 10) : 99999 };
  })
  .sort((a, b) => a.page - b.page || a.title.localeCompare(b.title, "zh-CN"));
let visibleCount = 80;
let filtered = STORIES.slice();

function storyText(c){
  return [c.title, c.id, c.ref, c.cn, (c.excerpts || []).join(" ")].join(" ").toLowerCase();
}
function render(){
  const q = (document.getElementById("q").value || "").trim().toLowerCase();
  filtered = q ? STORIES.filter(c => storyText(c).includes(q)) : STORIES.slice();
  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>${filtered.length}</b><span>匹配故事</span></div>
    <div class="stat"><b>${STORIES.length}</b><span>全部故事</span></div>`;
  const slice = filtered.slice(0, visibleCount);
  document.getElementById("storyGrid").innerHTML = slice.map(c => {
    const exps = (c.excerpts && c.excerpts.length) ? c.excerpts : (c.excerpt ? [c.excerpt] : []);
    const ex = exps.length ? `<p class="excerpt">“${exps[0]}”</p>` : "";
    return `<article class="card">
      <div class="card-top"><span class="badge">p${c.page === 99999 ? "?" : c.page}</span><span class="meta">${c.id}</span></div>
      <h3><a href="card.html?id=${c.id}#${c.id}" style="color:inherit">${c.title}</a></h3>
      ${ex}
    </article>`;
  }).join("");
  document.getElementById("empty").style.display = filtered.length ? "none" : "block";
  document.getElementById("loadMore").style.display = filtered.length > visibleCount ? "inline-block" : "none";
}
document.addEventListener("DOMContentLoaded", () => {
  render();
  document.getElementById("q").addEventListener("input", () => { visibleCount = 80; render(); });
  document.getElementById("randomBtn").addEventListener("click", () => {
    const c = STORIES[Math.floor(Math.random() * STORIES.length)];
    if (c) location.href = "card.html?id=" + c.id + "#" + c.id;
  });
  document.getElementById("clearBtn").addEventListener("click", () => { document.getElementById("q").value = ""; visibleCount = 80; render(); });
  document.getElementById("loadMore").addEventListener("click", () => { visibleCount += 80; render(); });
});
</script>
</body>
