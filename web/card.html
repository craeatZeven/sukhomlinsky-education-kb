<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>卡片详情 · 苏霍姆林斯基教育知识库</title>
<link rel="stylesheet" href="style.css?v=20260907" />
</head>
<body data-theme="green">
<nav class="topnav">
  <div class="inner">
    <a class="brand" href="index.html">苏霍姆林斯基教育知识库</a>
    <div class="nav-links">
      <a class="nav-link" href="index.html">首页</a>
      <a class="nav-link" href="explore.html">主题浏览</a>
      <a class="nav-link" href="clusters.html">思想地图</a>
      <a class="nav-link" href="cases.html">案例 Review</a>
      <a class="nav-link" href="sources.html">书源</a>
    </div>
  </div>
</nav>

<header class="page-head">
  <div class="wrap">
    <h1 id="cardTitle">卡片详情</h1>
    <p id="cardMeta"></p>
  </div>
</header>

<main class="wrap">
  <p style="margin:0 0 16px"><a href="index.html">首页</a> / <a href="explore.html">主题浏览</a> / 卡片详情</p>
  <section>
    <article class="card card--reading" id="cardMain"></article>
    <div style="display:flex;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap" id="pager"></div>
  </section>

  <section>
    <h2 class="section-title">相关卡片</h2>
    <div class="grid" id="related"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p><a href="index.html">← 返回首页</a> · 数据源 <a href="../INDEX.md">INDEX.md</a></p>
  </div>
</footer>

<script src="kb.js"></script>
<script src="theme.js?v=20260907"></script>
<script>
function getParam(){ return new URLSearchParams(location.search).get("id") || location.hash.replace("#",""); }
function cardLink(c){ return `card.html?id=${encodeURIComponent(c.id)}#${KB.esc(c.id)}`; }
function renderCard(c, error){
  if(!c){
    const msg = error
      ? (error.notFound
          ? `没有这张卡片（${KB.esc(getParam())}）。可能是链接里的 ID 有误，或卡片已调整。`
          : "卡片数据加载失败：" + KB.esc(error.message))
      : "未找到该卡片，请检查链接或去主题浏览。";
    document.getElementById("cardMain").innerHTML = `<p class="empty" style="display:block">${msg}</p>
      <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
        <a class="chip" style="text-decoration:none" href="explore.html">← 去主题浏览</a>
        <a class="chip" style="text-decoration:none" href="search.html">用检索页查找</a>
        <button class="chip" id="anotherBtn" type="button">随机看一张</button>
      </div>
      <h2 class="section-title" style="margin-top:26px">或者，从这里开始</h2>
      <div class="rows" id="fallbackRows"><p class="section-sub">正在取几张卡片…</p></div>`;
    document.getElementById("anotherBtn").addEventListener("click", ()=>{
      KB.loadIds().then(ids => {
        const id = ids[Math.floor(Math.random()*ids.length)];
        location.href = "card.html?id=" + encodeURIComponent(id) + "#" + id;
      }).catch(()=>{});
    });
    /* 空状态不给人死路：给三张真实卡片（WIP 的 404 做法） */
    KB.loadIds().then(ids => {
      const picks = [];
      const seen = new Set();
      while (picks.length < 3 && seen.size < ids.length) {
        const id = ids[Math.floor(Math.random()*ids.length)];
        if (!seen.has(id)) { seen.add(id); picks.push(id); }
      }
      return Promise.all(picks.map(id => KB.loadCard(id).catch(()=>null)));
    }).then(cards => {
      const box = document.getElementById("fallbackRows");
      if (!box) return;
      const list = cards.filter(Boolean);
      if (!list.length) { box.innerHTML = '<p class="section-sub">卡片数据暂不可用。</p>'; return; }
      box.innerHTML = list.map(c => KB.cardRowHTML({
        id: c.id, type: c.type, title: c.title, source: c.source, topics: c.topics, tags: c.tags,
        ref: c.ref, preview: (c.excerpts && c.excerpts[0]) || c.excerpt || "", n: (c.excerpts||[]).length,
        primary: c.primary, seealso: c.seealso, primary_name: c.primary_name,
      })).join("");
    }).catch(()=>{
      const box = document.getElementById("fallbackRows");
      if (box) box.innerHTML = '<p class="section-sub">卡片数据暂不可用。</p>';
    });
    return;
  }
  document.title = c.id + " · " + c.title + " · 苏霍姆林斯基教育知识库";
  document.getElementById("cardTitle").textContent = c.title;
  const entryTop = KB.entryBadges(c);
  const seeBadges = (c.seealso || []).map(code => KB.entryBadge(code, {kind:"see", cross:true})).join(" ");
  const exps = (c.excerpts && c.excerpts.length) ? c.excerpts : (c.excerpt ? [c.excerpt] : []);
  const excerptsHtml = exps.map(q=>`<div class="excerpt" style="margin-top:10px">${KB.esc(q)}</div>`).join("");
  const tags = (c.tags||[]).map(t=>KB.TAG_LABELS[t]||t);
  const ref = KB.refText(c.ref);
  const citation = `${c.title} // 苏霍姆林斯基教育知识库 ${c.id} · ${KB.sourceTitle(c.source)} · ${ref}`;
  document.getElementById("cardMeta").textContent = c.id + " · " + KB.sourceTitle(c.source);
  document.getElementById("cardMain").innerHTML = `
    <div class="card-top">
      <div>${entryTop}</div>
      <span class="badge">${KB.esc(KB.typeLabel(c.type))}</span>
    </div>
    <dl class="keyfacts">
      <dt>这一条属于</dt><dd>${c.primary ? KB.entryBadge(c.primary, {cross:true}) : `<a class="badge" href="facets.html">故事体 · 走故事分面</a>`}</dd>
      <dt>还涉及哪些条目</dt><dd>${seeBadges || "—"}</dd>
      <dt>出处</dt><dd>${KB.sourcePop(c.source, 'explore.html?source=' + encodeURIComponent(c.source))}</dd>
      <dt>出版信息</dt><dd>${KB.esc(KB.refShort(ref, c.source)) || "—"}</dd>
    </dl>
    ${excerptsHtml}
    ${c.cn?`<div class="cn"><b>中文转述：</b>${KB.esc(c.cn)}</div>`:""}
    ${tags.length?`<div style="margin-top:12px">${tags.map(t=>`<span class="meta" style="border:1px solid var(--line);border-radius:2px;padding:1px 8px;margin-right:6px">${KB.esc(t)}</span>`).join("")}</div>`:""}
    <div class="record">
      <b>关于本卡</b>　编号 ${KB.esc(c.id)}　录入 ${KB.esc(c.created || "—")}${c.updated && c.updated !== c.created ? `　最近校订 ${KB.esc(c.updated)}` : ""}${c.reviewed_by ? `　校验 ${KB.esc(c.reviewed_by)}` : ""}<br>
      原文摘自上述出版物，OCR 转写后逐段回查；「中文转述」为编者对该段的准确复述，不是原文。<br>
      发现错漏可在 <a href="https://github.com/craeatZeven/sukhomlinsky-education-kb/issues" target="_blank" rel="noopener">仓库 issue</a> 提出，或在 <a href="../INDEX.md" target="_blank" rel="noopener">INDEX.md</a> 里核对原始记录。
    </div>
    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="chip" id="copyBtn" type="button">复制引用</button>
      <button class="chip" id="shareBtn" type="button">分享</button>
      <button class="chip" id="printBtn" type="button">打印 / 存 PDF</button>
      <a class="chip" style="text-decoration:none" href="explore.html?source=${encodeURIComponent(c.source)}">查看同来源卡片 →</a>
      <a class="chip" style="text-decoration:none" href="../INDEX.md" target="_blank" rel="noopener">在 INDEX 中查看 ↗</a>
    </div>`;
  document.getElementById("copyBtn").addEventListener("click", ()=>{
    if(navigator.clipboard) navigator.clipboard.writeText(citation).then(()=>{document.getElementById("copyBtn").textContent="已复制";});
  });
  document.getElementById("shareBtn").addEventListener("click", async ()=>{
    const shareData = { title: c.title + " · 苏霍姆林斯基教育知识库", text: citation, url: location.href };
    if (navigator.share) {
      try { await navigator.share(shareData); } catch (e) {}
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(location.href);
      document.getElementById("shareBtn").textContent = "链接已复制";
    }
  });
  document.getElementById("printBtn").addEventListener("click", ()=>window.print());
  renderRelated(c);
  renderPager(c);
}
function renderPager(c){
  const prev = c.prev ? { id: c.prev } : null;
  const next = c.next ? { id: c.next } : null;
  document.getElementById("pager").innerHTML = `
    ${prev?`<a class="chip" style="text-decoration:none" href="${cardLink(prev)}">← ${KB.esc(prev.id)}</a>`:`<span></span>`}
    ${next?`<a class="chip" style="text-decoration:none" href="${cardLink(next)}">${KB.esc(next.id)} →</a>`:`<span></span>`}`;
}
function renderRelated(c){
  const rel = c.related || [];
  document.getElementById("related").innerHTML = rel.map(x=>`
    <a class="source-card" style="text-decoration:none;color:inherit" href="${cardLink(x)}">
      <span class="badge">${KB.esc(KB.typeLabel(x.type))}</span>
      <h3 style="margin:10px 0 4px;font-size:17px">${KB.esc(x.title)}</h3>
      <p class="ref">${KB.esc(x.id)} · ${x.primary ? KB.esc(x.primary + " " + (x.primary_name || KB.entryName(x.primary))) : "故事体 · 走故事分面"}</p>
    </a>`).join("") || `<p class="section-sub">暂无相关卡片</p>`;
}
document.addEventListener("DOMContentLoaded", async ()=>{
  const id = getParam();
  if(!id){ renderCard(null); return; }
  document.getElementById("cardMain").innerHTML = `<p class="section-sub">正在加载卡片…</p>`;
  try{
    /* 单卡 JSON 自带上一张/下一张/相关卡片，详情页不再拉整库索引 */
    const card = await KB.loadCard(id);
    renderCard(card);
    KB.ready().then(()=>{ if(card) renderCard(card); }).catch(()=>{});
  }catch(e){
    renderCard(null, e);
  }
});
</script>
</body>
</html>
