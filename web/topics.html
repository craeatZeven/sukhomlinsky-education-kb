<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>教育专题 · 苏霍姆林斯基教育知识库</title>
<link rel="stylesheet" href="style.css?v=20260907" />
</head>
<body data-theme="green">
<nav class="topnav">
  <div class="inner">
    <a class="brand" href="index.html">苏霍姆林斯基教育知识库</a>
    <div class="nav-links">
      <a class="nav-link" href="index.html">首页</a>
      <a class="nav-link active" href="topics.html">教育专题</a>
      <a class="nav-link" href="explore.html">主题浏览</a>
      <a class="nav-link" href="stories.html">541 篇故事</a>
      <a class="nav-link" href="problem.html">问题检索</a>
      <a class="nav-link" href="sources.html">书源</a>
    </div>
  </div>
</nav>

<header class="page-head">
  <div class="wrap">
    <div class="eyebrow">Topics</div>
    <h1>教育专题</h1>
    <p>把苏霍姆林斯基的思想按教育场景聚成 12 个专题：每个专题都有核心判断、可操作方法、跨书综合和对应卡片。</p>
  </div>
</header>

<main class="wrap">
  <section>
    <div class="grid" id="topicGrid"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p><a href="index.html">← 返回首页</a> · 数据源 <a href="../INDEX.md">INDEX.md</a></p>
  </div>
</footer>

<script src="kb.js"></script>
<script src="theme.js?v=20260907"></script>
<script>
document.addEventListener("DOMContentLoaded", ()=>{
  document.getElementById("topicGrid").innerHTML = `<p class="section-sub">正在加载主题…</p>`;
  KB.ready().then(meta=>{
    document.getElementById("topicGrid").innerHTML = meta.topics.map(t => {
      const core = (t.core || []).slice(0, 2).map(x => `<li>${KB.esc(x)}</li>`).join("");
      const methods = (t.methods || []).slice(0, 2).map(x => `<li>${KB.esc(x)}</li>`).join("");
      return `<article class="card">
        <div class="card-top"><span class="badge">${t.cards || 0} 张卡</span><span class="meta">${KB.esc(t.aliases || "")}</span></div>
        <h3 style="margin:10px 0 6px"><a href="topic.html?slug=${encodeURIComponent(t.slug)}" style="color:inherit">${KB.esc(t.title)}</a></h3>
        <p class="cn">${KB.esc(t.summary || "")}</p>
        <details style="margin-top:10px"><summary>核心判断</summary><ul>${core}</ul></details>
        <details style="margin-top:6px"><summary>可操作方法</summary><ul>${methods}</ul></details>
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
          <a class="chip" style="text-decoration:none" href="topic.html?slug=${encodeURIComponent(t.slug)}">进入专题 →</a>
          <a class="chip" style="text-decoration:none" href="explore.html?topic=${encodeURIComponent(t.slug)}">筛选卡片 →</a>
        </div>
      </article>`;
    }).join("");
  }).catch(e=>{
    document.getElementById("topicGrid").innerHTML = `<p class="section-sub">数据加载失败：${KB.esc(e.message)}</p>`;
  });
});
</script>
</body>
</html>
