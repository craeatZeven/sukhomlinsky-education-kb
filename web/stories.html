<script>
const ZUOREN_SOURCE = "zuo-ren-de-gu-shi-zh";
let STORIES = [];
let CORPUS = null;
let CORPUS_BY_ID = new Map();
let corpusLoading = false;
let visibleCount = 80;
let filtered = [];

function storyText(c, useCorpus){
  return KB.searchText(c, useCorpus ? CORPUS_BY_ID.get(c.id) : null);
}
function render(deep){
  const q = (document.getElementById("q").value || "").trim().toLowerCase();
  filtered = q ? STORIES.filter(c => storyText(c, deep).includes(q)) : STORIES.slice();
  /* 未筛选时不重复显示同一个数字 */
  const filteredOut = filtered.length !== STORIES.length;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>${filtered.length}</b><span>${filteredOut ? "匹配故事" : "全部故事"}${deep ? " · 已含原文全文" : ""}</span></div>
    ${filteredOut ? `<div class="stat"><b>${STORIES.length}</b><span>全部故事</span></div>` : ""}`;
  const slice = filtered.slice(0, visibleCount);
  document.getElementById("storyGrid").innerHTML = slice.map(c => {
    const pageLabel = c.page == null ? "p?" : "p" + c.page;
    return `<a class="row" href="card.html?id=${encodeURIComponent(c.id)}#${KB.esc(c.id)}">
      <p class="row-quote">“${KB.esc(c.preview || c.title)}”</p>
      <div class="row-meta">
        <span class="row-title">${KB.esc(c.title)}</span>
        <span>${KB.esc(pageLabel)}</span>
        <span>${KB.esc(c.id)}</span>
      </div>
    </a>`;
  }).join("");
  document.getElementById("empty").style.display = filtered.length ? "none" : "block";
  document.getElementById("loadMore").style.display = filtered.length > visibleCount ? "inline-block" : "none";
}
async function runSearch(){
  const q = (document.getElementById("q").value || "").trim();
  if(!q){ visibleCount = 80; render(false); return; }
  const quick = STORIES.filter(c => storyText(c, false).includes(q.toLowerCase()));
  if(quick.length || corpusLoading){ visibleCount = 80; render(false); return; }
  corpusLoading = true;
  document.getElementById("stats").innerHTML = `<div class="stat"><b>…</b><span>正在加载原文索引</span></div>`;
  try{
    CORPUS = await KB.loadSearch(ZUOREN_SOURCE);
    CORPUS_BY_ID = new Map(CORPUS.map(e => [e.id, e]));
  }catch(e){
    document.getElementById("stats").innerHTML = `<div class="stat"><b>0</b><span>原文索引加载失败，请改用<a href="search.html">检索页</a></span></div>`;
  }
  corpusLoading = false;
  visibleCount = 80;
  render(!!CORPUS);
}
document.addEventListener("DOMContentLoaded", async () => {
  document.getElementById("stats").innerHTML = `<div class="stat"><b>…</b><span>正在加载《做人的故事》索引</span></div>`;
  try{
    const list = await KB.loadIndexFor(ZUOREN_SOURCE);
    STORIES = list.slice().sort((a, b) =>
      (a.page == null ? 99999 : a.page) - (b.page == null ? 99999 : b.page) ||
      a.title.localeCompare(b.title, "zh-CN"));
  }catch(e){
    document.getElementById("stats").innerHTML = `<div class="stat"><b>0</b><span>数据加载失败：${KB.esc(e.message)}</span></div>`;
  }
  render(false);
  let debounce = null;
  document.getElementById("q").addEventListener("input", () => {
    clearTimeout(debounce);
    debounce = setTimeout(runSearch, 200);
  });
  document.getElementById("randomBtn").addEventListener("click", () => {
    const c = STORIES[Math.floor(Math.random() * STORIES.length)];
    if (c) location.href = "card.html?id=" + encodeURIComponent(c.id) + "#" + c.id;
  });
  document.getElementById("clearBtn").addEventListener("click", () => {
    document.getElementById("q").value = ""; visibleCount = 80; render(false);
  });
  document.getElementById("loadMore").addEventListener("click", () => { visibleCount += 80; render(!!CORPUS); });
});
</script>
