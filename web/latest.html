<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>最近更新 · 苏霍姆林斯基教育知识库</title>
<link rel="stylesheet" href="style.css?v=20260907" />
</head>
<body data-theme="green">
<nav class="topnav">
  <div class="inner">
    <a class="brand" href="index.html">苏霍姆林斯基教育知识库</a>
    <div class="nav-links">
      <a class="nav-link" href="index.html">首页</a>
      <a class="nav-link" href="topics.html">教育专题</a>
      <a class="nav-link" href="explore.html">主题浏览</a>
      <a class="nav-link" href="stories.html">541 篇故事</a>
      <a class="nav-link" href="problem.html">问题检索</a>
      <a class="nav-link" href="sources.html">书源</a>
    </div>
  </div>
</nav>

<header class="page-head">
  <div class="wrap">
    <div class="eyebrow">Latest</div>
    <h1>最近更新</h1>
    <p>按卡片 ID 倒序显示最近新增的内容；ID 越大，越新。</p>
  </div>
</header>

<main class="wrap">
  <section>
    <div class="stats" id="stats" style="margin:18px 0"></div>
    <div class="grid" id="latestGrid"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p><a href="index.html">← 返回首页</a> · 数据源 <a href="../INDEX.md">INDEX.md</a></p>
  </div>
</footer>

<script src="kb.js"></script>
<script src="theme.js?v=20260907"></script>
<script>
document.addEventListener("DOMContentLoaded", async ()=>{
  document.getElementById("latestGrid").innerHTML = `<p class="section-sub">正在加载最近卡片…</p>`;
  try{
    const meta = await KB.ready();
    const latest = await KB.loadLatest();
    document.getElementById("stats").innerHTML = `
      <div class="stat"><b>${latest.length}</b><span>最近卡片</span></div>
      <div class="stat"><b>${meta.counts.cards}</b><span>全部卡片</span></div>`;
    document.getElementById("latestGrid").innerHTML = latest.map(c=>`
      <article class="card">
        <div class="card-top">
          <span class="badge">${KB.esc(c.id)}</span>
          <span class="meta">${KB.esc(KB.typeLabel(c.type))}</span>
        </div>
        <h3 style="margin:10px 0 6px"><a href="card.html?id=${encodeURIComponent(c.id)}#${KB.esc(c.id)}" style="color:inherit">${KB.esc(c.title)}</a></h3>
        <p class="ref">${KB.esc(KB.sourceTitle(c.source))}</p>
        <p class="ref">${(c.topics||[]).map(t=>KB.esc(KB.topicTitle(t))).join(" / ")}</p>
      </article>`).join("");
  }catch(e){
    document.getElementById("latestGrid").innerHTML = `<p class="section-sub">数据加载失败：${KB.esc(e.message)}</p>`;
  }
});
</script>
</body>
</html>
