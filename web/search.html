<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API 检索 · 苏霍姆林斯基教育知识库</title>
<link rel="stylesheet" href="style.css?v=20260909">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">苏霍姆林斯基教育知识库</a>
    <nav>
      <a class="nav-link" href="index.html">首页</a>
      <a class="nav-link" href="explore.html">主题浏览</a>
      <a class="nav-link active" href="search.html">API 检索</a>
      <a class="nav-link" href="stories.html">541 篇故事</a>
      <a class="nav-link" href="coverage.html">覆盖</a>
      <a class="nav-link" href="guide.html">指南</a>
    </nav>
  </div>
</header>

<main class="wrap" style="padding:28px 0 60px">
  <div class="eyebrow">Server-side Search · FastAPI + SQLite FTS5</div>
  <h1 style="margin:6px 0 10px">API 检索（后端版）</h1>
  <p class="meta" id="apiState">正在连接后端…</p>

  <div class="card" style="padding:16px;margin-top:16px">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <input id="q" class="chip" style="min-width:260px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit" placeholder="搜索：劳动 / 教育 / 苏霍姆林斯基 / 情感教育（多词用空格）">
      <select id="fSource" class="chip"><option value="">全部来源</option></select>
      <select id="fTopic" class="chip"><option value="">全部主题</option></select>
      <select id="fType" class="chip"><option value="">全部类型</option></select>
      <select id="fSize" class="chip">
        <option value="10">每页 10</option>
        <option value="20" selected>每页 20</option>
        <option value="50">每页 50</option>
      </select>
      <button class="chip" id="searchBtn" type="button">检索</button>
      <button class="chip" id="randomBtn" type="button">随机一卡</button>
      <button class="chip" id="exportJson" type="button">导出本页 JSON</button>
      <button class="chip" id="exportCsv" type="button">导出本页 CSV</button>
    </div>
  </div>

  <div id="stats" style="display:flex;gap:18px;flex-wrap:wrap;margin:16px 0"></div>
  <div id="results"></div>
  <div id="pager" style="display:flex;gap:10px;align-items:center;margin-top:18px"></div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p><a href="index.html">← 返回首页</a> · 数据源 <a href="../INDEX.md">INDEX.md</a> · 后端说明 <a href="../api/README.md">api/README.md</a></p>
  </div>
</footer>

<script src="config.js?v=20260909"></script>
<script src="theme.js?v=20260909"></script>
<script>
const CFG = window.KB_CONFIG || {};
const API = (CFG.apiBase || "").replace(/\/$/, "");
const $ = id => document.getElementById(id);
let state = { q: "", source: "", topic: "", type: "", page: 1, size: 20, total: 0, pages: 0, items: [] };

function apiUrl(path){ return API + path; }

async function api(path){
  const r = await fetch(apiUrl(path), { headers: { "Accept": "application/json" } });
  if(!r.ok) throw new Error(path + " → HTTP " + r.status);
  return r.json();
}

function labelType(t){ return {quote:"quote 语录", case:"case 案例", principle:"principle 原则", method:"method 方法", practice:"practice 实践"}[t] || t; }

function cardHtml(c){
  const topics = (c.topics||[]).map(s=>`<a class="badge" style="margin-right:6px;text-decoration:none" href="topic.html?slug=${s}">${topicTitle(s)}</a>`).join("");
  const snippet = c.snippet ? `<p class="excerpt">…${snippet}…</p>` : "";
  return `<article class="card" style="padding:16px;margin-bottom:14px">
    <div class="card-top"><div>${topics}</div><span class="badge">${labelType(c.type)}</span></div>
    <h3 style="margin:8px 0 6px"><a href="card.html?id=${c.id}#${c.id}" style="color:inherit">${c.title}</a></h3>
    ${snippet}
    <div class="ref" style="margin-top:8px">${c.id} · ${sourceTitle(c.source)}<br>${c.ref || ""}</div>
  </article>`;
}

let META = { sources: [], topics: [] };
function topicTitle(slug){ const t = META.topics.find(x=>x.slug===slug); return t ? t.title : slug; }
function sourceTitle(slug){ const s = META.sources.find(x=>x.slug===slug); return s ? s.title : slug; }

async function loadMeta(){
  const m = await api("/api/meta");
  META.sources = (m.sources||[]).map(s=>({slug:s.slug, title:s.slug, cards:s.cards}));
  META.topics = (m.topics||[]).map(t=>({slug:t.slug, title:t.slug, cards:t.cards}));
  try{
    const st = await api("/api/sources");
    META.sources = st.items;
  }catch(e){}
  const fS = $("fSource"), fT = $("fTopic"), fType = $("fType");
  META.sources.forEach(s=>{ fS.insertAdjacentHTML("beforeend", `<option value="${s.slug}">${s.slug} · ${s.cards}</option>`); });
  META.topics.forEach(t=>{ fT.insertAdjacentHTML("beforeend", `<option value="${t.slug}">${t.slug} · ${t.cards}</option>`); });
  ["quote","case","principle","method","practice"].forEach(t=>{
    fType.insertAdjacentHTML("beforeend", `<option value="${t}">${labelType(t)}</option>`);
  });
  $("apiState").textContent = `后端已连接 · 共 ${m.total_cards} 张卡 · 来源 ${m.sources.length} · 主题 ${m.topics.length}（API：${API || "同源"}）`;
}

function buildQuery(){
  const p = new URLSearchParams();
  if(state.q) p.set("q", state.q);
  if(state.source) p.set("source", state.source);
  if(state.topic) p.set("topic", state.topic);
  if(state.type) p.set("type", state.type);
  p.set("page", state.page); p.set("size", state.size);
  return "/api/search?" + p.toString();
}

async function run(){
  $("results").innerHTML = `<p class="meta">检索中…</p>`;
  try{
    const r = await api(buildQuery());
    state.items = r.items || []; state.total = r.total || 0; state.pages = r.pages || 0;
    $("stats").innerHTML = `
      <div class="stat"><b>${state.total}</b><span>命中卡片</span></div>
      <div class="stat"><b>${state.pages}</b><span>页数</span></div>
      <div class="stat"><b>${r.mode}</b><span>检索模式</span></div>`;
    $("results").innerHTML = state.items.length ? state.items.map(cardHtml).join("")
      : `<p class="empty" style="display:block">没有匹配的卡片，换个词试试。</p>`;
    $("pager").innerHTML = `
      <button class="chip" id="prevBtn" type="button" ${state.page<=1?"disabled":""}>← 上一页</button>
      <span class="meta">第 ${state.page} / ${state.pages || 1} 页</span>
      <button class="chip" id="nextBtn" type="button" ${state.page>=state.pages?"disabled":""}>下一页 →</button>`;
    const prev = $("prevBtn"), next = $("nextBtn");
    if(prev) prev.addEventListener("click", ()=>{ state.page = Math.max(1, state.page-1); run(); });
    if(next) next.addEventListener("click", ()=>{ state.page = Math.min(state.pages, state.page+1); run(); });
  }catch(e){
    $("results").innerHTML = `<p class="empty" style="display:block">后端不可用：${e.message}<br>请先运行 <code>python scripts/build_db.py</code> 与 <code>uvicorn api.main:app</code>，或在 <code>web/config.js</code> 里把 <code>apiBase</code> 指向你的 API 地址。</p>`;
    $("apiState").textContent = "后端未连接";
  }
}

function downloadBlob(filename, text, type){
  const blob = new Blob([text], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  a.remove(); URL.revokeObjectURL(url);
}
function csvEscape(v){ const s = String(v==null?"":v).replace(/"/g,'""'); return /[",\n]/.test(s) ? `"${s}"` : s; }

document.addEventListener("DOMContentLoaded", async ()=>{
  try{ await loadMeta(); }catch(e){ $("apiState").textContent = "后端未连接（" + e.message + "）"; }
  $("searchBtn").addEventListener("click", ()=>{
    state.q = $("q").value.trim(); state.source = $("fSource").value;
    state.topic = $("fTopic").value; state.type = $("fType").value;
    state.size = parseInt($("fSize").value, 10) || 20; state.page = 1; run();
  });
  $("q").addEventListener("keydown", e=>{ if(e.key === "Enter") $("searchBtn").click(); });
  ["fSource","fTopic","fType","fSize"].forEach(id=>$(id).addEventListener("change", ()=>$("searchBtn").click()));
  $("randomBtn").addEventListener("click", async ()=>{
    try{ const c = await api("/api/random"); location.href = "card.html?id=" + c.id + "#" + c.id; }catch(e){ alert("后端不可用：" + e.message); }
  });
  $("exportJson").addEventListener("click", ()=>downloadBlob("kb-search-page.json", JSON.stringify(state.items, null, 2), "application/json"));
  $("exportCsv").addEventListener("click", ()=>{
    const cols = ["id","type","title","source","topics","ref"];
    const rows = [cols.join(",")].concat(state.items.map(c=>cols.map(k=>{
      if(k === "topics") return csvEscape((c.topics||[]).join("|"));
      return csvEscape(c[k]);
    }).join(",")));
    downloadBlob("kb-search-page.csv", "\ufeff" + rows.join("\n"), "text/csv;charset=utf-8");
  });
  run();
});
</script>
</body>
</html>
