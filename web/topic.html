<script>
async function render(){
  const slug = new URLSearchParams(location.search).get("slug");
  let meta;
  try { meta = await KB.ready(); }
  catch(e){
    document.getElementById("topicTitle").textContent = "数据加载失败";
    document.getElementById("topicSummary").textContent = e.message;
    return;
  }
  const topic = meta.topics.find(t=>t.slug===slug);
  if(!topic){
    document.getElementById("topicTitle").textContent = "未找到主题";
    document.getElementById("topicSummary").textContent = "请从主题浏览进入。";
    return;
  }
  document.getElementById("topicTitle").textContent = topic.title;
  document.getElementById("topicSummary").textContent = topic.summary || "";
  document.title = topic.title + " · 苏霍姆林斯基教育知识库";
  document.getElementById("topicBody").innerHTML = `
    <p><b>别名：</b>${KB.esc(topic.aliases || "无")}</p>
    <h3>核心判断</h3><ul>${(topic.core||[]).map(x=>`<li>${KB.esc(x)}</li>`).join("")}</ul>
    <h3>可操作方法</h3><ul>${(topic.methods||[]).map(x=>`<li>${KB.esc(x)}</li>`).join("")}</ul>
    <h3>跨书综合</h3><p>${KB.esc(topic.cross || "")}</p>`;

  document.getElementById("cardList").innerHTML = `<p class="section-sub">正在加载该主题卡片…</p>`;
  const list = await KB.loadTopicIndex(slug);
  /* 目录行一屏 40 条，避免一次铺开 200+ 行 */
  const PAGE_SIZE = 40;
  let shown = PAGE_SIZE;
  const paint = () => {
    document.getElementById("cardList").innerHTML = list.slice(0, shown).map(c=>KB.cardRowHTML(c)).join("") ||
      `<p class="section-sub">暂无卡片</p>`;
    document.getElementById("loadMore").style.display = list.length > shown ? "inline-block" : "none";
  };
  paint();
  document.getElementById("loadMore").addEventListener("click", ()=>{ shown += PAGE_SIZE; paint(); });

  const co = {};
  list.forEach(c => (c.topics||[]).forEach(t => { if(t !== slug) co[t] = (co[t]||0)+1; }));
  const related = Object.keys(co).sort((a,b)=>co[b]-co[a]).slice(0,4);
  document.getElementById("relatedTopics").innerHTML = related.map(s=>`
    <a class="source-card" style="text-decoration:none;color:inherit" href="topic.html?slug=${encodeURIComponent(s)}">
      <span class="badge">${co[s]} 张共现</span>
      <h3 style="margin:10px 0 4px;font-size:17px">${KB.esc(KB.topicTitle(s))}</h3>
      <p class="ref">进入专题 →</p>
    </a>`).join("") || `<p class="section-sub">暂无相关专题</p>`;

  const download = (filename, text, type) => {
    const blob = new Blob([text], {type});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    a.remove(); URL.revokeObjectURL(url);
  };
  const csvEscape = v => {
    const s = String(v == null ? "" : v).replace(/"/g, '""');
    return /[",\n]/.test(s) ? `"${s}"` : s;
  };
  document.getElementById("exportTopicJson").addEventListener("click", ()=>{
    download(topic.slug + ".json", JSON.stringify(list, null, 2), "application/json");
  });
  document.getElementById("exportTopicCsv").addEventListener("click", ()=>{
    const cols = ["id","type","title","source","topics","ref"];
    const rows = [cols.join(",")].concat(list.map(c=>cols.map(k=>{
      if(k==="topics") return csvEscape((c.topics||[]).join("|"));
      return csvEscape(k==="ref" ? KB.refText(c[k]) : c[k]);
    }).join(",")));
    download(topic.slug + ".csv", "\ufeff"+rows.join("\n"), "text/csv;charset=utf-8");
  });
}
document.addEventListener("DOMContentLoaded", render);
</script>
