</head>
<body data-theme="green">
<nav class="topnav">
  <div class="inner">
    <a class="brand" href="index.html">苏霍姆林斯基教育知识库</a>
    <div class="nav-links">
      <a class="nav-link" href="index.html">首页</a>

</nav>

<header class="page-head">
  <div class="wrap">
    <div class="eyebrow">Topics</div>
    <h1>教育专题</h1>
    <p>把苏霍姆林斯基的思想按教育场景聚成 12 个专题：每个专题都有核心判断、可操作方法、跨书综合和对应卡片。</p>
  </div>
</header>

<main class="wrap">
  <section>
    <div class="grid" id="topicGrid"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p><a href="index.html">← 返回首页</a> · 数据源 <a href="../INDEX.md">INDEX.md</a></p>
  </div>
</footer>

<script src="data.js?v=20260907"></script>
<script src="theme.js?v=20260907"></script>
<script>
const TOPICS = (window.KB_DATA && window.KB_DATA.topics) || [];
const CARDS = (window.KB_DATA && window.KB_DATA.cards) || [];
document.addEventListener("DOMContentLoaded", ()=>{
  const counts = {};
  CARDS.forEach(c => (c.topics || []).forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
  document.getElementById("topicGrid").innerHTML = TOPICS.map(t => {
    const core = (t.core || []).slice(0, 2).map(x => `<li>${x}</li>`).join("");
    const methods = (t.methods || []).slice(0, 2).map(x => `<li>${x}</li>`).join("");
    return `<article class="card">
      <div class="card-top"><span class="badge">${counts[t.slug] || 0} 张卡</span><span class="meta">${t.aliases || ""}</span></div>
      <h3 style="margin:10px 0 6px"><a href="topic.html?slug=${t.slug}" style="color:inherit">${t.title}</a></h3>
      <p class="cn">${t.summary || ""}</p>
      <details style="margin-top:10px"><summary>核心判断</summary><ul>${core}</ul></details>
      <details style="margin-top:6px"><summary>可操作方法</summary><ul>${methods}</ul></details>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <a class="chip" style="text-decoration:none" href="topic.html?slug=${t.slug}">进入专题 →</a>
        <a class="chip" style="text-decoration:none" href="explore.html?topic=${t.slug}">筛选卡片 →</a>
      </div>
    </article>`;
  }).join("");
});
</script>
</body>
</html>
