<header class="page-head">

    <div class="eyebrow">Latest</div>

<main class="wrap">
  <section>
    <div class="stats stats--quiet" id="stats"></div>

<script src="kb.js"></script>
<script src="theme.js?v=20260914"></script>
<script>
document.addEventListener("DOMContentLoaded", async ()=>{
  document.getElementById("latestGrid").innerHTML = `<p class="section-sub">正在加载最近卡片…</p>`;
  try{
    const meta = await KB.ready();
    const latest = await KB.loadLatest();
    document.getElementById("stats").innerHTML = `
      <div class="stat"><b>${latest.length}</b><span>最近卡片</span></div>
      <div class="stat"><b>${meta.counts.cards}</b><span>全部卡片</span></div>`;
    document.getElementById("latestGrid").innerHTML = latest.map(c=>`
      <a class="row" href="card.html?id=${encodeURIComponent(c.id)}#${KB.esc(c.id)}">
        <p class="row-quote">“${KB.esc(c.preview || c.title)}”</p>
        <div class="row-meta">
          <span class="row-title">${KB.esc(c.title)}</span>
          <span>${KB.esc(KB.typeLabel(c.type))}</span>
          ${KB.sourcePop(c.source)}
          <span>${KB.esc(c.id)}</span>
          <span class="row-entry">${KB.esc(KB.cardMetaText(c))}</span>
        </div>
      </a>`).join("");
  }catch(e){
    document.getElementById("latestGrid").innerHTML = `<p class="section-sub">数据加载失败：${KB.esc(e.message)}</p>`;
  }
});
</script>
</body>
