<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>主题 · 苏霍姆林斯基教育知识库</title>
<link rel="stylesheet" href="style.css?v=20260907" />
</head>
<body data-theme="green">
<nav class="topnav">
  <div class="inner">
    <a class="brand" href="index.html">苏霍姆林斯基教育知识库</a>
    <div class="nav-links">
      <a class="nav-link" href="index.html">首页</a>
      <a class="nav-link active" href="explore.html">主题浏览</a>
      <a class="nav-link" href="clusters.html">思想地图</a>
      <a class="nav-link" href="problem.html">问题检索</a>
      <a class="nav-link" href="cases.html">案例 Review</a>
      <a class="nav-link" href="sources.html">书源</a>
    </div>
  </div>
</nav>

<header class="page-head">
  <div class="wrap">
    <div class="eyebrow">Topic</div>
    <h1 id="topicTitle">主题</h1>
    <p id="topicSummary"></p>
  </div>
</header>

<main class="wrap">
  <section>
    <div id="topicBody"></div>
    <h2 class="section-title">本主题卡片</h2>
    <div class="load-wrap" style="margin:0 0 14px">
      <button id="exportTopicJson" class="chip" type="button">导出本专题 JSON</button>
      <button id="exportTopicCsv" class="chip" type="button">导出本专题 CSV</button>
    </div>
    <div class="grid" id="cardList"></div>
    <h2 class="section-title" style="margin-top:28px">相关专题</h2>
    <div class="grid" id="relatedTopics"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p><a href="index.html">← 返回首页</a> · 数据源 <a href="../INDEX.md">INDEX.md</a></p>
  </div>
</footer>

<script src="kb.js"></script>
<script src="theme.js?v=20260907"></script>
<script>
async function render(){
  const slug = new URLSearchParams(location.search).get("slug");
  let meta;
  try { meta = await KB.ready(); }
  catch(e){
    document.getElementById("topicTitle").textContent = "数据加载失败";
    document.getElementById("topicSummary").textContent = e.message;
    return;
  }
  const topic = meta.topics.find(t=>t.slug===slug);
  if(!topic){
    document.getElementById("topicTitle").textContent = "未找到主题";
    document.getElementById("topicSummary").textContent = "请从主题浏览进入。";
    return;
  }
  document.getElementById("topicTitle").textContent = topic.title;
  document.getElementById("topicSummary").textContent = topic.summary || "";
  document.title = topic.title + " · 苏霍姆林斯基教育知识库";
  document.getElementById("topicBody").innerHTML = `
    <p><b>别名：</b>${KB.esc(topic.aliases || "无")}</p>
    <h3>核心判断</h3><ul>${(topic.core||[]).map(x=>`<li>${KB.esc(x)}</li>`).join("")}</ul>
    <h3>可操作方法</h3><ul>${(topic.methods||[]).map(x=>`<li>${KB.esc(x)}</li>`).join("")}</ul>
    <h3>跨书综合</h3><p>${KB.esc(topic.cross || "")}</p>`;

  document.getElementById("cardList").innerHTML = `<p class="section-sub">正在加载该主题卡片…</p>`;
  const list = await KB.loadTopicIndex(slug);
  document.getElementById("cardList").innerHTML = list.map(c=>`
    <a class="source-card" style="text-decoration:none;color:inherit" href="card.html?id=${encodeURIComponent(c.id)}#${KB.esc(c.id)}">
      <div class="card-top">
        <span class="badge">${KB.esc(KB.typeLabel(c.type))}</span>
        <span class="ref">${KB.esc(c.id)}</span>
      </div>
      <h3 style="margin:10px 0 4px;font-size:17px">${KB.esc(c.title)}</h3>
      <p class="cn" style="color:var(--soft)">${KB.esc(c.cn || "")}</p>
    </a>`).join("") || `<p class="section-sub">暂无卡片</p>`;

  const co = {};
  list.forEach(c => (c.topics||[]).forEach(t => { if(t !== slug) co[t] = (co[t]||0)+1; }));
  const related = Object.keys(co).sort((a,b)=>co[b]-co[a]).slice(0,4);
  document.getElementById("relatedTopics").innerHTML = related.map(s=>`
    <a class="source-card" style="text-decoration:none;color:inherit" href="topic.html?slug=${encodeURIComponent(s)}">
      <span class="badge">${co[s]} 张共现</span>
      <h3 style="margin:10px 0 4px;font-size:17px">${KB.esc(KB.topicTitle(s))}</h3>
      <p class="ref">进入专题 →</p>
    </a>`).join("") || `<p class="section-sub">暂无相关专题</p>`;

  const download = (filename, text, type) => {
    const blob = new Blob([text], {type});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    a.remove(); URL.revokeObjectURL(url);
  };
  const csvEscape = v => {
    const s = String(v == null ? "" : v).replace(/"/g, '""');
    return /[",\n]/.test(s) ? `"${s}"` : s;
  };
  document.getElementById("exportTopicJson").addEventListener("click", ()=>{
    download(topic.slug + ".json", JSON.stringify(list, null, 2), "application/json");
  });
  document.getElementById("exportTopicCsv").addEventListener("click", ()=>{
    const cols = ["id","type","title","source","topics","ref"];
    const rows = [cols.join(",")].concat(list.map(c=>cols.map(k=>{
      if(k==="topics") return csvEscape((c.topics||[]).join("|"));
      return csvEscape(k==="ref" ? KB.refText(c[k]) : c[k]);
    }).join(",")));
    download(topic.slug + ".csv", "\ufeff"+rows.join("\n"), "text/csv;charset=utf-8");
  });
}
document.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
