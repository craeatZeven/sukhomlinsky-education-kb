name: check-kb

on:
  push:
    paths:
      - 'sources/**'
      - 'topics/**'
      - 'cards/**'
      - 'INDEX.md'
      - 'schemas/**'
      - 'templates/**'
      - 'scripts/check_kb.py'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Validate knowledge base
        run: python scripts/check_kb.py
      - name: Build site data
        run: python scripts/build_site.py
