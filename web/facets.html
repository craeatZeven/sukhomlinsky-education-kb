<script>
document.addEventListener("DOMContentLoaded", async () => {
  let meta;
  try { meta = await KB.ready(); }
  catch(e){
    document.getElementById("groups").innerHTML =
      `<p class="section-sub">数据加载失败：${KB.esc(e.message)}</p>`;
    return;
  }
  const facets = meta.facets || [];
  const ready = !!meta.facets_ready;
  const story = ((meta.classification || {}).story) || 0;
  const markedTotal = facets.reduce((a, f) => a + (f.count || 0), 0);

  document.getElementById("facetStats").innerHTML = `
    <div class="stat"><b>3</b><span>字段</span></div>
    <div class="stat"><b>${facets.length}</b><span>分面</span></div>
    <div class="stat"><b>${story}</b><span>故事体卡片</span></div>
    <div class="stat"><b>${markedTotal}</b><span>分面标记（可多选）</span></div>
    <div class="stat"><b>${ready ? "已就绪" : "计数已算出"}</b><span>分面标记</span></div>`;

  if(!ready){
    /* 过渡态兜底：计数已在 meta.facets 里，但分片还没带上卡片清单。
       正常上线后这段不会出现——所以元素默认带 hidden，
       否则 `.pending-note` 的边框会以**空框**形式留在页面上（评审就抓到了这个空框）。 */
    document.getElementById("pending").hidden = false;
    document.getElementById("pending").innerHTML = `
      <b>分面计数已算出，但数据分片里的卡片清单还没更新</b>
      <p>下面每个分面的张数都是从 <code>data/meta.json</code> 读出来的真实数字，不是 0；
      但 <code>data/facet/&lt;编号&gt;.json</code> 里的 <code>cards</code> 还是空的，所以点进分面页暂时列不出卡片。
      重建分片（<code>python scripts/validate_all.py</code>）后即可。</p>`;
  }

  const byField = [];
  facets.forEach(f => {
    let g = byField.find(x => x.field === f.field);
    if(!g){ g = {field: f.field, items: []}; byField.push(g); }
    g.items.push(f);
  });

  document.getElementById("groups").innerHTML = byField.map((g, i) => `
  <section>
    <h2 class="section-title">${i + 1} · ${KB.esc(g.field)}</h2>
    <p class="angle-note">${g.items.length} 个分面 · 共 ${g.items.reduce((a, f) => a + (f.count || 0), 0)} 个分面标记（一张故事可落进多个分面）</p>
    <div class="grid">
      ${g.items.map(f => `
      <a class="source-card" style="text-decoration:none;color:inherit" href="facet.html?code=${encodeURIComponent(f.code)}">
        <div class="card-top">
          <span class="badge">${KB.esc(f.code)}</span>
          <span class="badge">${KB.esc(f.field)}</span>
        </div>
        <h3 style="margin:10px 0 4px;font-size:17px">${KB.esc(f.name)}</h3>
        <p class="ref">${f.count} 张故事 →</p>
      </a>`).join("")}
    </div>
  </section>`).join("");
});
</script>
