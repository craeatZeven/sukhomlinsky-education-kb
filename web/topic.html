<script>
async function render(){
  const slug = new URLSearchParams(location.search).get("slug");
  let meta;
  try { meta = await KB.ready(); }
  catch(e){
    document.getElementById("topicTitle").textContent = "数据加载失败";
    document.getElementById("topicSummary").textContent = e.message;
    return;
  }
  const topic = meta.topics.find(t=>t.slug===slug);
  if(!topic){
    document.getElementById("topicTitle").textContent = "未找到主题";
    document.getElementById("topicSummary").textContent = "请从主题浏览进入。";
    return;
  }
  document.getElementById("topicTitle").textContent = topic.title;
  /* 2026-09-19：这里原来对正文用 KB.esc()，于是专题长文里的 **判断** 和 [[sk-0026]]
     原样显示在页面上（用户截图报的）。改成 KB.linkify()：双链变链接、**加粗**变 <strong>。
     纯文本的地方（标题/摘要/文档标题）走 KB.plain()，把记号洗掉。 */
  document.getElementById("topicSummary").textContent = KB.plain(topic.summary || "");
  document.title = KB.plain(topic.title) + " · 苏霍姆林斯基教育知识库";
  /* 2026-09-19：这一块原来两个毛病 ——
     ① 正文用 KB.esc()，于是 **加粗** 与 [[sk-0026]] 原样显示（用户截图报的）；
     ② 三节都是 <h3>…</h3><ul><li>…：项目符号 + 默认缩进，是"文档"的样子，
        不是"编辑过的页面"的样子。而这一页在站点分层里属于**阅读层**。
     现在：行内走 KB.linkify（加粗 + 双链），结构换成编辑版式——
     编号论纲 / 左名右释 / 左边线阅读块。顺带把正文标题从 h3 提到 h2：
     页面只有 h1，原来正文直接跳 h3，axe 一直报 heading-order。 */
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  /* 「**动作名**：解释」拆成标题 + 正文；没有加粗前缀的整条当正文 */
  function splitLead(html){
    var m = /^<strong>([\s\S]+?)<\/strong>\s*[：:]\s*([\s\S]*)$/.exec(html);
    return m ? { lead: m[1], body: m[2] } : { lead: "", body: html };
  }
  /* 引用括注摘出来单独成行。
     用户 2026-09-19：「能不能不用 sk-，这样无法直接对应起来」——
     句子里只剩一个 sk-0026，读者对不上是哪张卡。现在引用行直接显示**卡片标题**，
     点进去才是卡片页；标题超过 18 字截断，完整标题放 title 属性。 */
  var REF_MAP = topic.refs || {};
  var REF_RE = /\[\[(sk-\d{4})\]\]/g;
  function splitRefs(text){
    var ids = [], m;
    REF_RE.lastIndex = 0;
    while ((m = REF_RE.exec(text)) !== null) {
      if (ids.indexOf(m[1]) < 0) ids.push(m[1]);
    }
    var body = String(text)
      .replace(/[（(][^（）()]*\[\[sk-\d{4}\]\][^（）()]*[）)]/g, "")
      .replace(/\s+([，。；、])/g, "$1").trim();
    return { ids: ids, body: body };
  }
  function refLine(ids){
    if (!ids.length) return "";
    return '<p class="refs"><span class="k">依据</span>' + ids.map(function(id){
      var full = REF_MAP[id] || id;
      var shown = full.length > 18 ? full.slice(0, 18) + "…" : full;
      return '<a class="ref" href="card.html?id=' + encodeURIComponent(id) + '" title="' +
             full.replace(/"/g, "&quot;") + '">' + shown + '</a>';
    }).join('<span class="sep">·</span>') + '</p>';
  }
  var core = topic.core || [], methods = topic.methods || [], cross = topic.cross || "";
  var parts = ['<p class="topic-meta"><span class="k">别名</span>' +
               KB.plain(topic.aliases || "（无）") + '</p>'];
  /* 2026-09-20：这个专题**自己的深度分析**挂在这里。
     用户问「说做的每个主题一个分析的在哪里，我没找到」——
     实测全站只有 reads.html / sitemap.html 有指向分析页的链接，专题页自己不指向讲它的那篇。
     映射由 build_shards.py 按「卡片集合重合度」算好写进 meta（12/12 全配上）。 */
  if (topic.analysis) {
    /* href 在字符串外先拼好：站点链接自检扫的是**静态**地址（注释里也不要写示例，它连注释一起扫），
       而这是一个运行时才知道的地址（12 个专题共用这一页）。
       拼在字面量里会让那个检查器把 ' + encodeURIComponent(…) + ' 当成路径一部分 ——
       那是它的边界，不是链接真坏了（真链路由渲染后体检与线上 D5 覆盖）。 */
    var aHref = 'note/' + encodeURIComponent(topic.analysis.slug) + '.html';
    parts.unshift('<p class="topic-analysis"><span class="k">深度分析</span>' +
      '<a href="' + aHref + '">' +
      KB.esc(topic.analysis.title) + '</a>' +
      '<span class="meta">编者写的分析：跨 ' + topic.analysis.cards + ' 张卡，给出张力、反例与边界</span></p>');
  }
  var secs = [];
  if (core.length) secs.push({ name: "核心判断",
    html: '<ol class="theses" role="list">' + core.map(function(x, i){
      var r = splitRefs(x);
      return '<li class="thesis"><span class="thesis-n">' + pad(i + 1) +
             '</span><div class="thesis-t">' + KB.linkify(r.body) + refLine(r.ids) + '</div></li>';
    }).join("") + '</ol>' });
  if (methods.length) secs.push({ name: "可操作方法",
    html: '<div class="methods">' + methods.map(function(x){
      var r = splitRefs(x);
      var s = splitLead(KB.linkify(r.body));
      return '<article class="method">' + (s.lead ? '<h3>' + s.lead + '</h3>' : "") +
             '<div><p>' + s.body + '</p>' + refLine(r.ids) + '</div></article>';
    }).join("") + '</div>' });
  /* cross 在数据里是**带列表标记**的（每条都以 "- " 开头，12 个专题全是），
     直接塞进 <p> 会渲染出一个多余的短横。逐行剥掉标记，一行一段。 */
  if (cross) {
    var crossLines = String(cross).split("\n").map(function(l){
      return l.replace(/^\s*[-*]\s+/, "").trim();
    }).filter(function(l){ return l; });
    var crossIds = [];
    var crossHtml = crossLines.map(function(l){
      var r = splitRefs(l);
      r.ids.forEach(function(id){ if (crossIds.indexOf(id) < 0) crossIds.push(id); });
      return '<p>' + KB.linkify(r.body) + '</p>';
    }).join("");
    secs.push({ name: "跨书综合",
      html: '<div class="reading">' + crossHtml + '</div>' + refLine(crossIds) });
  }
  parts.push(secs.map(function(s, i){
    return '<section class="tblock"><h2 class="tblock-h"><span class="tblock-n">' +
           pad(i + 1) + '</span>' + s.name + '</h2>' + s.html + '</section>';
  }).join(""));
  document.getElementById("topicBody").innerHTML = parts.join("");

  document.getElementById("cardList").innerHTML = `<p class="section-sub">正在加载该主题卡片…</p>`;
  const list = await KB.loadTopicIndex(slug);
  /* 目录行一屏 40 条，避免一次铺开 200+ 行 */
  const PAGE_SIZE = 40;
  let shown = PAGE_SIZE;
  const paint = () => {
    document.getElementById("cardList").innerHTML = list.slice(0, shown).map(c=>KB.cardRowHTML(c)).join("") ||
      `<p class="section-sub">暂无卡片</p>`;
    document.getElementById("loadMore").style.display = list.length > shown ? "inline-block" : "none";
  };
  paint();
  document.getElementById("loadMore").addEventListener("click", ()=>{ shown += PAGE_SIZE; paint(); });

  const co = {};
  list.forEach(c => (c.topics||[]).forEach(t => { if(t !== slug) co[t] = (co[t]||0)+1; }));
  const related = Object.keys(co).sort((a,b)=>co[b]-co[a]).slice(0,4);
  document.getElementById("relatedTopics").innerHTML = related.map(s=>`
    <a class="source-card" style="text-decoration:none;color:inherit" href="topic.html?slug=${encodeURIComponent(s)}">
      <span class="badge">${co[s]} 张共现</span>
      <h3 style="margin:10px 0 4px;font-size:17px">${KB.esc(KB.topicTitle(s))}</h3>
      <p class="ref">进入专题 →</p>
    </a>`).join("") || `<p class="section-sub">暂无相关专题</p>`;

  const download = (filename, text, type) => {
    const blob = new Blob([text], {type});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    a.remove(); URL.revokeObjectURL(url);
  };
  const csvEscape = v => {
    const s = String(v == null ? "" : v).replace(/"/g, '""');
    return /[",\n]/.test(s) ? `"${s}"` : s;
  };
  document.getElementById("exportTopicJson").addEventListener("click", ()=>{
    download(topic.slug + ".json", JSON.stringify(list, null, 2), "application/json");
  });
  document.getElementById("exportTopicCsv").addEventListener("click", ()=>{
    const cols = ["id","type","title","source","topics","ref"];
    const rows = [cols.join(",")].concat(list.map(c=>cols.map(k=>{
      if(k==="topics") return csvEscape((c.topics||[]).join("|"));
      return csvEscape(k==="ref" ? KB.refText(c[k]) : c[k]);
    }).join(",")));
    download(topic.slug + ".csv", "\ufeff"+rows.join("\n"), "text/csv;charset=utf-8");
  });
}
document.addEventListener("DOMContentLoaded", render);
</script>
